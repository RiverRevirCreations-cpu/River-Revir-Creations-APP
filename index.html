<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/rrc-icon-192.png">
  <title>River Revir Creations</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; background: #fff; }
    .card { width: min(360px, 90vw); text-align: center; }
    img { width: 160px; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
    button { background: #111; color: #fff; border: 0; border-radius: 8px; }
    #msg { color: #b00020; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card" id="login">
    <img src="icons/rrc-icon-512.png" alt="RRC logo">
    <h2>River Revir Creations</h2>
    <p>Photobooth Management System</p>
    <form id="loginForm">
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="pin" type="password" placeholder="Access PIN" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div id="msg"></div>
    </form>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = 'Signing in...';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'login',
            username: document.getElementById('username').value.trim(),
            pin: document.getElementById('pin').value
          })
        });
        const data = await res.json();
        if (data.ok) {
          sessionStorage.setItem('rrcLoggedIn', '1');
          showDashboard();
        } else {
          msg.textContent = data.message;
        }
      } catch (err) {
        msg.textContent = 'Could not reach the server. Check your connection.';
      }
    });

    function showDashboard() {
      document.getElementById('login').innerHTML = '<h2>Dashboard</h2><p>Signed in.</p>';
      // load your bookings here with more fetch() calls to API_URL
    }
  </script>
</body>
</html>
