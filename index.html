<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/rrc-icon-192.png">
  <title>River Revir Creations</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    .box img {
      width: 150px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      margin-top: 8px;
    }
    #message {
      color: #b00020;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/rrc-icon-512.png" alt="RRC logo">
    <h2>River Revir Creations</h2>
    <p>Photobooth Management System</p>

    <input id="username" type="text" placeholder="Username">
    <input id="pin" type="password" placeholder="Access PIN">
    <button id="signInButton">Sign in</button>
    <div id="message"></div>
  </div>

  <script>
  const API_URL =  "https://script.google.com/macros/s/AKfycbz_VuOocluN4U5r3V6QdboTvxvQb_a-lJyaNSEYN6mjpMRVrupBUE2GS_V3N_bErlKt/exec";
  let rrcToken = "";

  async function callApi(action, args, token) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: action, args: args || [], token: token || "" })
    });
    return res.json();
  }

  document.getElementById("signInButton").addEventListener("click", async function () {
    const message = document.getElementById("message");
    message.style.color = "#b00020";
    message.textContent = "Signing in...";
    try {
      const result = await callApi("verifyCredentials", [
        document.getElementById("username").value,
        document.getElementById("pin").value
      ]);
      if (!result.ok) { message.textContent = result.message; return; }
      if (result.data.success) {
        rrcToken = result.data.authToken;
        message.style.color = "#1a7f37";
        message.textContent = "Welcome, " + result.data.name + " (" + result.data.role + ")";
      } else {
        message.textContent = result.data.message;
      }
    } catch (error) {
      message.textContent = "Could not connect. Check your internet and try again.";
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
