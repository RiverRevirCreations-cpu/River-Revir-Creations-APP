<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>River Revir Creations</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/rrc-icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff;color:#343434;display:grid;place-items:center;padding:24px}main{width:min(100%,520px);text-align:center;border:1px solid #e5e5e5;border-radius:24px;background:#fff;padding:32px 24px;box-shadow:0 16px 44px rgba(20,20,20,.07)}img{width:min(100%,300px);height:auto;object-fit:contain;margin:0 auto 20px;display:block}h1{font-size:clamp(1.5rem,5vw,2rem);margin:0 0 8px;font-weight:600}p{line-height:1.55;color:#686868;margin:0 auto 20px;max-width:40ch}a{display:inline-block;border-radius:12px;padding:14px 20px;background:#343434;color:#fff;text-decoration:none;font-weight:650}small{display:block;margin-top:16px;line-height:1.5;color:#686868}
</style>
</head>
<body>
<main>
<img src="./icons/rrc-icon-512.png" alt="River Revir Creations logo">
<h1>Opening River Revir Creations…</h1>
<p>Taking you to the existing RRC Photobooth Management System.</p>
<a id="launch" href="https://script.google.com/macros/s/AKfycbzIOUPNTBminVmAFroB-KkAehrsJM5cWSYO0_EyD5sHx-WbV7D0vVV3pPP-nwb1oOkm/exec" rel="noopener">Open RRC Management System</a>
<small>If the system does not open automatically, tap the button above.</small>
</main>
<script>
// Direct-launch enhancement only: replaces the launch page with the existing Apps Script URL.
// No Apps Script source, authentication, data, or deployment settings are changed.
const RRC_APP_URL = 'https://script.google.com/macros/s/AKfycbzIOUPNTBminVmAFroB-KkAehrsJM5cWSYO0_EyD5sHx-WbV7D0vVV3pPP-nwb1oOkm/exec';
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(function (error) { console.warn('RRC service worker registration failed:', error); });
  });
}
// A short delay allows the branded fallback to appear if navigation is blocked.
window.setTimeout(function () {
  window.location.replace(RRC_APP_URL);
}, 700);
</script>
</body>
</html>
