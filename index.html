<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/rrc-icon-192.png">
  <title>River Revir Creations</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    .box img {
      width: 150px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #111111;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      margin-top: 8px;
    }
    #message {
      color: #b00020;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/rrc-icon-512.png" alt="RRC logo">
    <h2>River Revir Creations</h2>
    <p>Photobooth Management System</p>

    <input id="username" type="text" placeholder="Username">
    <input id="pin" type="password" placeholder="Access PIN">
    <button id="signInButton">Sign in</button>
    <div id="message"></div>
  </div>

  <script>
    // Paste your Apps Script web app URL between the quotes below
   const API_URL = "https://script.google.com/macros/s/AKfycbwqQaCoG2NupU2NKSAGDmKDORUG4m3aiw-6xi9bTXg1__S0oo8QJ8qUwn_4L7ChvBeE/exec";

    document.getElementById("signInButton").addEventListener("click", async function () {
      const message = document.getElementById("message");
      message.textContent = "Signing in...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "login",
            username: document.getElementById("username").value,
            pin: document.getElementById("pin").value
          })
        });

        const result = await response.json();

        if (result.ok) {
          message.style.color = "#1a7f37";
          message.textContent = "Welcome! Login works.";
        } else {
          message.style.color = "#b00020";
          message.textContent = result.message;
        }
      } catch (error) {
        message.textContent = "Could not connect. Check your internet and try again.";
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
